name: ZemTab complete release test
# The staging app starts the full test by sending this repository_dispatch.
# workflow_dispatch remains available for the queued-run fallback poller.
on:
  repository_dispatch:
    types: [zemtab-complete-release-test]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zemtab-staging-release-test
  cancel-in-progress: false

jobs:
  complete-release-test:
    if: github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install browser test runtime
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run complete staged release test
        env:
          RUN_ID: ${{ github.event.client_payload.run_id }}
          CALLBACK_URL: ${{ github.event.client_payload.callback_url }}
          CALLBACK_SECRET: ${{ secrets.ZEMTAB_CALLBACK_SECRET }}
          BASE_URL: ${{ github.event.client_payload.base_url }}
          ADMIN_EMAIL: ${{ secrets.ZEMTAB_STAGING_ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ZEMTAB_STAGING_ADMIN_PASSWORD }}
          RELEASE_TEST_SEED_BATCHES: 50
          ZEMTAB_STAGES: 10,20,40,60,80,100,150,200,300,400,500
          ZEMTAB_STAGE_SECONDS: 90
          ZEMTAB_STAFF_SCREENS: 2
          ZEMTAB_POLL_INTERVAL_MS: 30000
          ZEMTAB_LOGIN_SPACING_MS: 12000
        run: node tools/github-release-runner.cjs

  scheduled-fallback:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install browser test runtime
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Pick up a queued staging run
        env:
          STAGING_BASE_URL: ${{ secrets.ZEMTAB_STAGING_BASE_URL || 'https://lavenderblush-jellyfish-274510.hostingersite.com' }}
          CALLBACK_SECRET: ${{ secrets.ZEMTAB_CALLBACK_SECRET }}
          ADMIN_EMAIL: ${{ secrets.ZEMTAB_STAGING_ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ZEMTAB_STAGING_ADMIN_PASSWORD }}
          RELEASE_TEST_SEED_BATCHES: 50
          ZEMTAB_STAGES: 10,20,40,60,80,100,150,200,300,400,500
          ZEMTAB_STAGE_SECONDS: 90
          ZEMTAB_STAFF_SCREENS: 2
          ZEMTAB_POLL_INTERVAL_MS: 30000
          ZEMTAB_LOGIN_SPACING_MS: 12000
        run: node tools/github-release-poller.cjs
